name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy api worker.py
      - run: bandit -r api main.py database.py worker.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # tests/integration usa Testcontainers: sobe seu próprio Postgres via Docker,
      # já disponível nos runners hospedados do GitHub — não precisa de um services: aqui.
      # Cobertura medida sobre unit+integration juntos: routers/middleware só são
      # exercitados pelos testes de integração, então o limite não faz sentido isolado.
      # --cov-fail-under vem de [tool.coverage.report] no pyproject.toml.
      - run: pytest tests/unit tests/integration --cov=api --cov-report=term-missing

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/orders
      # Pega migration desatualizada em relação aos models (ex.: alguém adiciona um Column
      # sem gerar/ajustar a revision correspondente) antes que vire drift em produção.
      - run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/orders
