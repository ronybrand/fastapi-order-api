name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy api worker.py
      - run: bandit -r api main.py database.py worker.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # tests/integration usa Testcontainers: sobe seu próprio Postgres via Docker,
      # já disponível nos runners hospedados do GitHub — não precisa de um services: aqui.
      # Cobertura medida sobre unit+integration juntos: routers/middleware só são
      # exercitados pelos testes de integração, então o limite não faz sentido isolado.
      # --cov-fail-under vem de [tool.coverage.report] no pyproject.toml.
      - run: pytest tests/unit tests/integration --cov=api --cov-report=term-missing

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/orders
      # Pega migration desatualizada em relação aos models (ex.: alguém adiciona um Column
      # sem gerar/ajustar a revision correspondente) antes que vire drift em produção.
      - run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/orders

  docker-build:
    needs: [test, migration]
    runs-on: ubuntu-latest
    # Build-only on PRs (validates the Dockerfile still produces a working image); push to GHCR
    # only from main, where GITHUB_TOKEN has package-write on this repo by default - a fork's PR
    # run gets a read-only token, so pushing there would just fail, not add security value.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Scans a local copy of the image before anything is pushed. HIGH/CRITICAL findings with a
      # fix available fail the job; unfixed ones are noise nobody can act on yet. The build
      # below reuses these layers from the builder's own cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: order-api:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: order-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Gera um snapshot estatico do OpenAPI spec - nao existe deploy live desta API pra
  # navegar em /docs (main.py desabilita docs_url/redoc_url/openapi_url em producao).
  # scripts/export_openapi.py so importa `app` e chama app.openapi() em processo, sem
  # subir servidor nem banco - por isso este job nao precisa de Postgres/services.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Importing main.app (export_openapi.py does this to call app.openapi()) now requires
      # JWT_PUBLIC_KEY_PATH (see ADR 0004) - any syntactically valid RSA public key works here,
      # this job never mints or verifies a real token, it only introspects route metadata.
      - run: |
          openssl genrsa -out /tmp/jwt-private.pem 2048
          openssl rsa -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
      - run: python scripts/export_openapi.py
        env:
          JWT_PUBLIC_KEY_PATH: /tmp/jwt-public.pem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi-spec
          path: dist-openapi/openapi.json
          if-no-files-found: error
          retention-days: 7

  # Publica o snapshot como pagina Redoc - a unica forma de ver o formato da API sem
  # clonar o repo. So em push pra main. O environment/permissions `github-pages` aqui e
  # o contrato exigido pelo proprio actions/deploy-pages, sem relacao com OIDC/AWS.
  pages:
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: openapi-spec
          path: site
      - run: cp docs/api-docs/index.html site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
