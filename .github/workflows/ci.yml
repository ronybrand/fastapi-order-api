name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy api worker.py
      - run: bandit -r api main.py database.py worker.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # tests/integration usa Testcontainers: sobe seu próprio Postgres via Docker,
      # já disponível nos runners hospedados do GitHub — não precisa de um services: aqui.
      # Cobertura medida sobre unit+integration juntos: routers/middleware só são
      # exercitados pelos testes de integração, então o limite não faz sentido isolado.
      # --cov-fail-under vem de [tool.coverage.report] no pyproject.toml.
      - run: pytest tests/unit tests/integration --cov=api --cov-report=term-missing

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/orders
      # Pega migration desatualizada em relação aos models (ex.: alguém adiciona um Column
      # sem gerar/ajustar a revision correspondente) antes que vire drift em produção.
      - run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/orders

  docker-build:
    needs: [test, migration]
    runs-on: ubuntu-latest
    # Build-only on PRs (validates the Dockerfile still produces a working image); push to GHCR
    # only from main, where GITHUB_TOKEN has package-write on this repo by default - a fork's PR
    # run gets a read-only token, so pushing there would just fail, not add security value.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Gera um snapshot estatico do OpenAPI spec - nao existe deploy live desta API pra
  # navegar em /docs (main.py desabilita docs_url/redoc_url/openapi_url em producao).
  # scripts/export_openapi.py so importa `app` e chama app.openapi() em processo, sem
  # subir servidor nem banco - por isso este job nao precisa de Postgres/services.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Importing main.app (export_openapi.py does this to call app.openapi()) now requires
      # JWT_PUBLIC_KEY_PATH (see ADR 0004) - any syntactically valid RSA public key works here,
      # this job never mints or verifies a real token, it only introspects route metadata.
      - run: |
          openssl genrsa -out /tmp/jwt-private.pem 2048
          openssl rsa -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
      - run: python scripts/export_openapi.py
        env:
          JWT_PUBLIC_KEY_PATH: /tmp/jwt-public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: dist-openapi/openapi.json
          if-no-files-found: error
          retention-days: 7

  # Publica o snapshot como pagina Redoc - a unica forma de ver o formato da API sem
  # clonar o repo. So em push pra main. O environment/permissions `github-pages` aqui e
  # o contrato exigido pelo proprio actions/deploy-pages, sem relacao com OIDC/AWS.
  pages:
    needs: docs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: site
      - run: cp docs/api-docs/index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
