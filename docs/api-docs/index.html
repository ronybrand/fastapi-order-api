<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fastapi-order-api - API docs</title>
    <!--
      Static snapshot of the OpenAPI spec, generated by scripts/export_openapi.py
      (imports the FastAPI `app` object and calls app.openapi() directly - no
      server, no database) and published here by the `pages` CI job on every
      push to main. There is no live instance of this API to browse /docs on
      (main.py disables docs_url/redoc_url/openapi_url in production), so this
      is a build-time snapshot, not a live docs server.
    -->
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <redoc spec-url="./openapi.json"></redoc>
    <script src="https://cdn.redocly.com/redoc/latest/bundles/redoc.standalone.js"></script>
  </body>
</html>
